<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一封生日邀请 · 10.26</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#f4a9c4;color:#192a24;font-family:Georgia,"Songti SC",serif;display:grid;place-items:center;padding:24px}main{width:min(100%,540px);position:relative;background:#fffdf1;padding:clamp(28px,7vw,64px)}.date{display:flex;justify-content:space-between;font-size:16px;margin-bottom:48px}.date strong{background:#f9e66b;padding:6px 12px;transform:rotate(-5deg)}h1{font-size:clamp(40px,8vw,58px);font-weight:500;line-height:1.15;letter-spacing:-2px;margin:0 0 24px}p{font-size:18px;line-height:1.7}label{display:block;margin:32px 0 10px}input,button{font:inherit;width:100%;padding:15px;border:0}input{background:white;border-bottom:2px solid #192a24;border-radius:0}button{margin-top:20px;background:#192a24;color:#fffdf1;cursor:pointer}button:disabled{opacity:.6}input:focus-visible,button:focus-visible{outline:3px solid #387867;outline-offset:4px}#status{font-size:15px;min-height:26px;margin-bottom:0}.owner{font-size:14px;color:#51655b;margin-top:26px}.star{position:absolute;right:28px;top:-33px;font-size:70px;color:#387867;transform:rotate(12deg)}
</style></head><body><main><span class="star" aria-hidden="true">✦</span><div class="date"><span>只送给我们</span><strong>10 / 26</strong></div><h1>冰激凌，<br>礼物在里面。</h1><p>输入我们的访问码，<br>去看看那些想和你一起留住的日子。</p><form id="access-form"><label for="access-code">访问码</label><input id="access-code" type="password" autocomplete="current-password" required maxlength="200"><button type="submit">打开生日礼物 ↗</button><p id="status" role="status"></p></form><p class="owner">准备礼物的人，可以在这里输入主人管理码。</p></main><script>
document.getElementById('access-form').onsubmit=async event=>{event.preventDefault();const button=event.target.querySelector('button');const status=document.getElementById('status');button.disabled=true;status.textContent='正在打开…';try{const response=await fetch('/api/access',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.getElementById('access-code').value})});const data=await response.json();if(!response.ok)throw Error(data.error);location.replace('/');}catch(error){status.textContent=error.message||'暂时没有连上，请重试。';button.disabled=false;}};
</script></body></html>
